<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お悩みサイコロ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .chat-bubble {
            position: relative;
            background: #f3f4f6;
            border-radius: 1rem;
            padding: 1rem;
            margin-top: 1rem;
        }

        .chat-bubble::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 20px;
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent #f3f4f6 transparent;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-gray-800">お悩みサイコロ</h1>
            <p class="text-gray-600">悩んだら、サイコロふっとけ。</p>
        </div>

        <div class="space-y-4">
            <textarea 
                id="worryInput"
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="悩みを入力してください..."
                rows="4"
            ></textarea>

            <button 
                id="rollButton"
                class="w-full bg-blue-500 text-white py-3 px-6 rounded-lg hover:bg-blue-600 transition-colors duration-200"
            >
                サイコロをふる
            </button>

            <div id="resultContainer" class="hidden">
                <div class="chat-bubble fade-in">
                    <p id="adviceText" class="text-gray-800"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // カテゴリ別のアドバイスリスト
        const adviceCategories = {
            work: [
                '仕事は明日にしよう',
                '上司に相談してみては？',
                '休憩時間を確保して',
                '優先順位を見直そう'
            ],
            relationship: [
                '相手の気持ちも考えてみよう',
                '素直に謝ることも大事',
                '話し合いの時間を作ろう',
                '一人の時間も大切だよ'
            ],
            health: [
                'まず寝よう',
                'とりあえず水飲んだ？',
                'スマホ置いて深呼吸しよう',
                '散歩に行ってみよう'
            ],
            general: [
                'それってつまり運命',
                '気のせいじゃない？',
                '大丈夫、君は悪くない',
                'それ、猫なら気にしないよ',
                '逆にチャンスかもね'
            ]
        };

        // キーワードによるカテゴリ判定
        function detectCategory(text) {
            const keywords = {
                work: ['仕事', '会社', '上司', '部下', '職場', '転職', '給料', '残業'],
                relationship: ['恋愛', '結婚', '友達', '家族', '彼氏', '彼女', '夫', '妻', '子供'],
                health: ['体調', '睡眠', '疲れ', '病気', '運動', '食事', 'ストレス']
            };

            for (const [category, words] of Object.entries(keywords)) {
                if (words.some(word => text.includes(word))) {
                    return category;
                }
            }
            return 'general';
        }

        // 文章の長さに応じた返答スタイルの調整
        function getResponseStyle(text) {
            const length = text.length;
            if (length < 10) return 'short';
            if (length < 50) return 'medium';
            return 'long';
        }

        // 回答を生成する
        function generateResponse(text) {
            const category = detectCategory(text);
            const style = getResponseStyle(text);
            const adviceList = adviceCategories[category];
            
            let response = adviceList[Math.floor(Math.random() * adviceList.length)];
            
            // 文章の長さに応じて追加のフレーズを付け加える
            if (style === 'long') {
                response = 'よく整理できてますね。' + response;
            } else if (style === 'short') {
                response += '...もう少し具体的に教えてくれると、もっといいアドバイスができるかも？';
            }
            
            return response;
        }

        const worryInput = document.getElementById('worryInput');
        const rollButton = document.getElementById('rollButton');
        const resultContainer = document.getElementById('resultContainer');
        const adviceText = document.getElementById('adviceText');

        rollButton.addEventListener('click', () => {
            const worry = worryInput.value.trim();
            if (worry === '') {
                alert('悩みを入力してください！');
                return;
            }

            resultContainer.classList.remove('hidden');
            const response = generateResponse(worry);
            
            // アニメーション効果のためにいったん非表示にする
            resultContainer.style.opacity = '0';
            adviceText.textContent = response;
            
            // フェードインアニメーション
            setTimeout(() => {
                resultContainer.style.opacity = '1';
                resultContainer.classList.add('fade-in');
            }, 100);
        });
    </script>
</body>
</html>
